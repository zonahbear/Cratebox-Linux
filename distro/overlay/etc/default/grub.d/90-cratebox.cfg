# Cratebox OS on the 12-inch MacBook:
# - mem_sleep_default=s2idle: deep (S3) sleep leaves the speakers dead until the next power-up
#   (verified); s2idle keeps them working
# - preempt=full: the generic kernel is PREEMPT_DYNAMIC; full preemption gives the audio threads
#   steadier scheduling under load (proposed)
# - threadirqs: interrupt handlers run as threads the scheduler can rank, as on Ubuntu Studio (proposed)
# - nowatchdog: no NMI watchdog ticking on a performance counter of the 4.5 W Core m (proposed)
# - fbcon=font:TER16x32: boot and console text twice the size, readable on the 226 ppi panel
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT mem_sleep_default=s2idle preempt=full threadirqs nowatchdog fbcon=font:TER16x32"
# Faster boot: no visible menu (hold Esc at power-on for it), and no 30 s menu after an unclean
# shutdown or a failed wake (GRUB's recordfail)
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
GRUB_RECORDFAIL_TIMEOUT=0
