# 12-inch MacBook (CS4208): the speaker path has no hardware gain, so PipeWire does the volume in
# software. Verified on Jonah's MacBook10,1 (in ~/.config there; this is the system-wide copy).
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
