# Cratebox OS: compressed swap in RAM, so memory pressure from Chrome or a big library scan swaps
# to RAM instead of the SSD (proposed). Swappiness stays at the default: a higher one would push
# the decoded tracks out of RAM sooner, and the audio thread would then wait on page faults
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
