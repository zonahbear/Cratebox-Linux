[package]
name = "cratebox"
version = "0.1.0"
edition = "2021"
description = "Two-deck DJ software for the Pioneer DDJ-FLX4 and friends"
authors = ["Jonah <zonahbear@gmail.com>"]
license = "UNLICENSED"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cratebox"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
cpal = "0.16"
libc = "0.2"
midir = "0.10"
symphonia = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
dirs = "6"
png = "0.17"
# SHA-256 for the HEAT Lorax unlock
sha2 = "0.10"

# HEAT on Linux: BlueZ over D-Bus in pure Rust (no libdbus)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Windows: HEAT over WinRT Bluetooth LE, MMCSS "Pro Audio" for the audio thread, the local clock
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation", "Foundation_Collections", "Storage_Streams",
  "Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration", "Devices_Radios",
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 3
